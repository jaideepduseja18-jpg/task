<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipe – Hero</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #981e1e;
    }

    
    .hero {
      background-color: #0d0505;  
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 4rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #8a6f4e;
      font-size: 1.1rem;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .nav-cta {
      background: #fff;
      color: #1a1a1a;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .nav-cta:hover {
      background: #f0f0f0;
      transform: translateY(-1px);
    }

    
    .hero-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 1.5rem 5rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .eyebrow {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 1.5rem;
    }

    .hero-title {
      font-size: clamp(2.4rem, 5.5vw, 3.8rem);
      font-weight: 700;
      line-height: 1.15;
      color: #fff;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .hero-subtitle {
      font-size: 1.15rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
      max-width: 580px;
      margin-bottom: 2.5rem;
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #243017; /* soft green from the image */
      color: #fff;
      border: none;
      padding: 0.95rem 1.8rem;
      border-radius: 6px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .hero-btn:hover {
      background: #6ba035;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .hero-btn svg {
      width: 18px;
      height: 18px;
    }

    
    @media (max-width: 900px) {
      .navbar {
        padding: 1.25rem 1.5rem;
      }

      .nav-links {
        display: none; 
      }
    }

    @media (max-width: 600px) {
      .hero-title {
        font-size: 2.2rem;
      }

      .hero-subtitle {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <!-- Navigation -->
    <nav class="navbar">
      <a href="#" class="logo">
        <span class="logo-icon">p</span>
        pipe
      </a>

      <ul class="nav-links">
        <li><a href="#">Products</a></li>
        <li><a href="#">Company</a></li>
        <li><a href="#">Resources</a></li>
      </ul>

      <button class="nav-cta">Get Started</button>
    </nav>

    <!-- Hero Content -->
    <div class="hero-content">
      <p class="eyebrow">For companies with recurring revenue</p>
      
      <h1 class="hero-title">
        Get paid by the year,<br>
        charge by the month
      </h1>
      
      <p class="hero-subtitle">
        Stop pushing your customers into discounted annual subscriptions.
        Your subscriptions are an asset, trade them like one.
      </p>
      
      <button class="hero-btn">
        Get Started
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </section>

</body>
</html>
